apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/CrowdSalat/ocp-gitops.git
    targetRevision: HEAD
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true