# Library metadata database and cover art / cached images.
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: audiobookshelf-metadata
  namespace: app-audiobookshelf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: lvms-vg1
  volumeMode: Filesystem