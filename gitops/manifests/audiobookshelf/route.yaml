apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: audiobookshelf
  namespace: app-audiobookshelf
spec:
  host: audiobookshelf.apps.ocp.jharings.de
  to:
    kind: Service
    name: audiobookshelf
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None