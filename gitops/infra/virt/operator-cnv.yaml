apiVersion: v1
kind: Namespace
metadata:
  name: openshift-virtualization
  labels:
    openshift.io/cluster-monitoring: "true"
    # KubeVirt's virt-handler and virt-launcher run privileged and need access
    # to /dev/kvm on the node, so this namespace cannot use the restricted
    # pod security profile.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    argocd.argoproj.io/managed-by: openshift-gitops
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cnv-operatorgroup
  namespace: openshift-virtualization
spec:
  targetNamespaces:
  - openshift-virtualization
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kubevirt-hyperconverged
  namespace: openshift-virtualization
spec:
  # stable ships CNV 4.22.12, which matches the OpenShift 4.22 hub.
  channel: stable
  installPlanApproval: Automatic
  name: kubevirt-hyperconverged
  source: redhat-operators
  sourceNamespace: openshift-marketplace
