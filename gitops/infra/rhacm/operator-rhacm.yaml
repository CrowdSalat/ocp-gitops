apiVersion: v1
kind: Namespace
metadata:
  name: open-cluster-management
  labels:
    openshift.io/cluster-monitoring: "true"
    # The RHACM/MCE operators run components (search backend, klusterlet agent)
    # that need elevated privileges beyond the baseline pod security profile.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    argocd.argoproj.io/managed-by: openshift-gitops
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhacm-operatorgroup
  namespace: open-cluster-management
spec:
  targetNamespaces:
  - open-cluster-management
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhacm-operator
  namespace: open-cluster-management
spec:
  # Channel release-2.17 ships RHACM 2.17.4 with MCE 2.17. The bundled
  # HyperShift Operator supports OpenShift 4.20-4.22 hosted clusters on
  # OpenShift Virtualization, AWS, bare metal, IBM Power and IBM Z.
  channel: release-2.17
  installPlanApproval: Automatic
  name: advanced-cluster-management
  source: redhat-operators
  sourceNamespace: openshift-marketplace
