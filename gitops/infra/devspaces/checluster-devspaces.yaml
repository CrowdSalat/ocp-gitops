apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
spec:
  devEnvironments:
    defaultEditor: che-incubator/che-code/latest
    secondsOfInactivityBeforeIdling: 3600

    # Nested container builds are out of scope (see docs/devspaces.md). Without this the
    # operator hands users the `container-build` SCC, which adds SETUID/SETGID.
    disableContainerBuildCapabilities: true

    # Single-node host: node CPU requests sit around 85% once the platform is running.
    # One running workspace cluster-wide keeps a browser IDE from starving Argo CD and
    # the application namespaces.
    maxNumberOfRunningWorkspacesPerCluster: 1

    defaultContainerResources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: '4'
        memory: 4Gi
    storage:
      pvcStrategy: per-user
      perUserStrategyPvcConfig:
        # The LVMS volume group is 447Gi with well under 50Gi free, and the app
        # volumes already claim ~126Gi (ollama alone takes 50Gi). 40Gi here
        # starves every other application volume on the first workspace start.
        claimSize: 15Gi
