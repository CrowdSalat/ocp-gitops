# GitHub SSH keypair for Dev Spaces workspaces.
#
# The DevWorkspace Operator only discovers automount Secrets in the namespace the
# workspace runs in (<username>-devspaces), which is auto-provisioned on first
# dashboard login and is deliberately not GitOps content (see docs/devspaces.md).
#
# This ExternalSecret targets openshift-devspaces instead. Dev Spaces' own
# replication engine copies any Secret there labelled
# app.kubernetes.io/part-of=che.eclipse.org + app.kubernetes.io/component=workspaces-config
# into every user namespace, carrying labels and annotations across, and reverts
# drift. That gives us the fan-out without a ClusterExternalSecret and without
# hardcoding a username into this repo. See docs/devspaces.md.
#
# Note this delivers the private key to every user namespace on the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devspaces-git-ssh-key
  namespace: openshift-devspaces
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: devspaces-git-ssh-key
    # Owner so deleting this ExternalSecret tears the Secret down, which makes
    # Dev Spaces withdraw the key from the user namespaces it was replicated into.
    creationPolicy: Owner
    template:
      type: Opaque
      # Without this the secret ends up holding only `config` and none of the
      # keys from spec.data: Replace means template.data/templateFrom is the
      # whole payload, and the values fetched from Infisical are dropped. ESO
      # still reports SecretSynced because the fetch itself worked, so this
      # fails silently.
      mergePolicy: Merge
      metadata:
        labels:
          # Dev Spaces replicates this Secret into every <username>-devspaces
          # namespace. Without both labels the fan-out does not happen.
          app.kubernetes.io/part-of: che.eclipse.org
          app.kubernetes.io/component: workspaces-config
          # DevWorkspace Operator automount. Both are required: watch-secret adds
          # the Secret to the operator's informer, mount-to-devworkspace marks it.
          controller.devfile.io/watch-secret: 'true'
          controller.devfile.io/mount-to-devworkspace: 'true'
        annotations:
          controller.devfile.io/mount-path: /home/user/.ssh
          # subpath mounts each key as its own file and leaves the rest of
          # ~/.ssh intact. `file` would replace the directory and drop
          # known_hosts and any existing ssh config.
          controller.devfile.io/mount-as: subpath
          # The operator defaults to 0640, and OpenSSH rejects any identity file
          # with group or world bits set ("Permissions 0640 ... are too open").
          controller.devfile.io/mount-access-mode: "0600"
          # subpath mounts do not pick up updates in place, and without this an
          # ESO refresh would restart any running workspace.
          controller.devfile.io/mount-on-start: "true"
      data:
        # id_ed25519_github is not in ssh's auto-detected set (id_rsa, id_ecdsa,
        # id_ed25519, ...), so the key needs an explicit IdentityFile. This file
        # is GitOps-managed and shadows any ~/.ssh/config on the workspace PVC.
        config: |
          Host github.com
            IdentityFile ~/.ssh/id_ed25519_github
            IdentitiesOnly yes
  data:
    # The key must be unencrypted. A passphrase would need the operator's
    # experimental ssh-add postStart hook, and nothing can prompt for it.
    - secretKey: id_ed25519_github
      remoteRef:
        key: GH_SSH_KEY_PRIVATE
    - secretKey: id_ed25519_github.pub
      remoteRef:
        key: GH_SSH_KEY_PUBLIC